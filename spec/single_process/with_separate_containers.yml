---
services:
  fixture:
    extends:
      file: "../compose.yml"
      service: fixture
  postgres:
    extends:
      file: "../compose.yml"
      service: postgres
  huginn:
    extends:
      file: "../compose.yml"
      service: single_process
    environment:
      DATABASE_ADAPTER: postgresql
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_USERNAME: huginn
      DATABASE_PASSWORD: docker-specs-postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
    - 127.0.0.1::3000
  huginn_agent_runner:
    extends:
      file: "../compose.yml"
      service: single_process
    environment:
      DATABASE_ADAPTER: postgresql
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_USERNAME: huginn
      DATABASE_PASSWORD: docker-specs-postgres
      WORKER_CMD: bin/agent_runner.rb
    ports: []
    healthcheck:
      disable: true
    depends_on:
      huginn:
        condition: service_healthy
  huginn_jobs:
    extends:
      file: "../compose.yml"
      service: single_process
    environment:
      DATABASE_ADAPTER: postgresql
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_USERNAME: huginn
      DATABASE_PASSWORD: docker-specs-postgres
    ports: []
    healthcheck:
      disable: true
    depends_on:
      huginn:
        condition: service_healthy
    command:
    - bash
    - "-ec"
    - source /scripts/setup_env; exec bundle exec bin/delayed_job_master -c config/delayed_job_master.rb
volumes:
  postgres-data: {}
