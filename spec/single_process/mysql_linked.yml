---
services:
  fixture:
    extends:
      file: "../compose.yml"
      service: fixture
  mysql:
    extends:
      file: "../compose.yml"
      service: mysql
  huginn:
    extends:
      file: "../compose.yml"
      service: single_process
    environment:
      DATABASE_ADAPTER: mysql2
      DATABASE_HOST: mysql
      DATABASE_PORT: '3306'
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: docker-specs-mysql
    depends_on:
      mysql:
        condition: service_healthy
    ports:
    - 127.0.0.1::3000
  huginn_threaded:
    extends:
      file: "../compose.yml"
      service: single_process
    environment:
      DATABASE_ADAPTER: mysql2
      DATABASE_HOST: mysql
      DATABASE_PORT: '3306'
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: docker-specs-mysql
      WORKER_CMD: bin/threaded.rb
    ports: []
    healthcheck:
      disable: true
    depends_on:
      huginn:
        condition: service_healthy
volumes:
  mysql-data: {}
