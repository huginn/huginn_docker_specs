---
services:
  fixture:
    extends:
      file: "../compose.yml"
      service: fixture
  postgres:
    extends:
      file: "../compose.yml"
      service: postgres
  huginn:
    extends:
      file: "../compose.yml"
      service: single_process
    environment:
      DATABASE_ADAPTER: postgresql
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_USERNAME: huginn
      DATABASE_PASSWORD: docker-specs-postgres
      HUGINN_PORT: tcp://10.245.220.130:3000
    env_file:
    - ".env"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
    - 127.0.0.1::3000
  huginn_threaded:
    extends:
      file: "../compose.yml"
      service: single_process
    environment:
      DATABASE_ADAPTER: postgresql
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_USERNAME: huginn
      DATABASE_PASSWORD: docker-specs-postgres
      WORKER_CMD: bin/threaded.rb
    env_file:
    - ".env"
    ports: []
    healthcheck:
      disable: true
    depends_on:
      huginn:
        condition: service_healthy
volumes:
  postgres-data: {}
