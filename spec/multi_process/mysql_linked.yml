---
services:
  fixture:
    extends:
      file: "../compose.yml"
      service: fixture
  mysql:
    extends:
      file: "../compose.yml"
      service: mysql
  huginn:
    extends:
      file: "../compose.yml"
      service: multi_process
    environment:
      DATABASE_ADAPTER: mysql2
      DATABASE_HOST: mysql
      DATABASE_PORT: '3306'
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: docker-specs-mysql
    depends_on:
      mysql:
        condition: service_healthy
    ports:
    - 127.0.0.1::3000
volumes:
  mysql-data: {}
