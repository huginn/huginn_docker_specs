---
services:
  fixture:
    extends:
      file: "../compose.yml"
      service: fixture
  permissions:
    extends:
      file: "../compose.yml"
      service: permissions
  huginn:
    extends:
      file: "../compose.yml"
      service: multi_process
    volumes:
    - mysql-data:/var/lib/mysql
    depends_on:
      permissions:
        condition: service_completed_successfully
    ports:
    - 127.0.0.1::3000
volumes:
  mysql-data: {}
