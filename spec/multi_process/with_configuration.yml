---
services:
  fixture:
    extends:
      file: "../compose.yml"
      service: fixture
  mysql:
    extends:
      file: "../compose.yml"
      service: mysql
    environment:
      MYSQL_DATABASE: huginn_production
      MYSQL_USER: huginn
      MYSQL_PASSWORD: myhuginn=password
  huginn:
    extends:
      file: "../compose.yml"
      service: multi_process
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_ADAPTER: mysql2
      DATABASE_HOST: mysql
      DATABASE_PORT: '3306'
      DATABASE_USERNAME: huginn
      DATABASE_PASSWORD: myhuginn=password
      DO_NOT_SEED: 'true'
      DO_NOT_CREATE_DATABASE: 'true'
      ADDITIONAL_GEMS: 'huginn_website_metadata_agent(git: https://github.com/kreuzwerker/DKT.huginn_website_metadata_agent.git),huginn_readability_agent(git:
        https://github.com/kreuzwerker/DKT.huginn_readability_agent.git)'
      APP_SECRET_TOKEN: docker-specs-fixed-secret
    ports:
    - 127.0.0.1::3000
volumes:
  mysql-data: {}
