---
services:
  fixture:
    extends:
      file: "../compose.yml"
      service: fixture
  postgres:
    extends:
      file: "../compose.yml"
      service: postgres
  huginn:
    extends:
      file: "../compose.yml"
      service: multi_process
    environment:
      DATABASE_ADAPTER: postgresql
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_USERNAME: huginn
      DATABASE_PASSWORD: docker-specs-postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
    - 127.0.0.1::3000
volumes:
  postgres-data: {}
